<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blocked while you focus · Focus Nest</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <main class="wrap">
    <p class="mark">🪺 Focus Nest</p>
    <h1>Not right now.</h1>
    <p class="lead">
      <strong id="site">This site</strong> is on your distraction list, and you're in the
      middle of a focus session. It will open again the moment your session ends.
    </p>
    <p class="meta" id="meta">Checking your session…</p>
    <p class="hint">Take the breath. Then go back to the tab you meant to be in.</p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
